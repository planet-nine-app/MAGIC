<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>potion-game</title>
<style>
  body {
    background: #0a0a1a;
    color: #e8e8e8;
    font-family: "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .scene {
    width: 640px;
    border: 4px solid #4a4a7a;
    background: #12122a;
    padding: 24px;
    box-shadow: 0 0 40px rgba(80, 80, 160, 0.4);
  }
  .boss {
    text-align: center;
    font-size: 48px;
    margin-bottom: 8px;
  }
  .boss-name {
    text-align: center;
    color: #ff6b6b;
    letter-spacing: 4px;
    margin-bottom: 24px;
  }
  .player-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .player-sprite { font-size: 32px; }
  .hp-bar-outer {
    flex: 1;
    height: 20px;
    background: #222;
    border: 2px solid #666;
  }
  .hp-bar-inner {
    height: 100%;
    background: linear-gradient(90deg, #4ade80, #22c55e);
    transition: width 0.6s ease-out;
  }
  .hp-text { width: 90px; text-align: right; }
  .log {
    margin-top: 24px;
    min-height: 24px;
    text-align: center;
    color: #ffd166;
    font-size: 14px;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .log.show { opacity: 1; }
</style>
</head>
<body>
  <div class="scene">
    <div class="boss">\u{1F479}</div>
    <div class="boss-name">CHAOS AWAITS</div>
    <div class="player-row">
      <div class="player-sprite">\u{1F9D9}</div>
      <div class="hp-bar-outer"><div class="hp-bar-inner" id="hpBar" style="width: 0%"></div></div>
      <div class="hp-text" id="hpText">?? / ??</div>
    </div>
    <div class="log" id="log"></div>
  </div>

  <script>
    const hpBar = document.getElementById('hpBar');
    const hpText = document.getElementById('hpText');
    const log = document.getElementById('log');

    const render = (hp, maxHp) => {
      hpBar.style.width = Math.round((hp / maxHp) * 100) + '%';
      hpText.textContent = hp + ' / ' + maxHp;
    };

    const showLog = (message) => {
      log.textContent = message;
      log.classList.add('show');
      setTimeout(() => log.classList.remove('show'), 2500);
    };

    fetch('/state').then((r) => r.json()).then(({ hp, maxHp }) => render(hp, maxHp));

    const events = new EventSource('/events');
    events.addEventListener('potion', (e) => {
      const { hp, maxHp } = JSON.parse(e.data);
      render(hp, maxHp);
      showLog('A potion was thrown! +HP');
    });
  </script>
</body>
</html>
