[env:um_tinys3]
platform = espressif32
board = um_tinys3
framework = arduino

; Serial Monitor settings
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; Dependencies - ESP-NOW, WiFi (mode-only, never connected) and Preferences
; are all in the ESP32 Arduino core, no extra lib_deps needed for them.
lib_deps =
    adafruit/Adafruit NeoPixel@^1.11.0

; Upload settings
upload_speed = 921600
; Pinned because auto-detection picks the wrong board when both the wand
; and target are plugged in simultaneously (confirmed - a target upload
; grabbed this exact port instead). If this ever fails with a "port busy"
; or "not found" error, run `pio device list` and update this to match
; whichever port is actually the wand - USB port renumbering happens on
; replug/reboot.
upload_port = /dev/cu.usbmodem2101
monitor_port = /dev/cu.usbmodem2101
